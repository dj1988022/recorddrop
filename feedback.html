<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback — RecordDrop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#e5e5e5;line-height:1.6;min-height:100vh;padding:60px 20px}
.container{max-width:680px;margin:0 auto}
nav{text-align:center;margin-bottom:40px}
nav a{color:#666;text-decoration:none;margin:0 12px;font-size:.9rem}
nav a:hover{color:#aaa}
nav a.active{color:#fff;font-weight:600}
h1{font-size:2rem;margin-bottom:8px;background:linear-gradient(135deg,#fff 0%,#888 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:#666;margin-bottom:32px}
.form-card{background:#141414;border:1px solid #222;border-radius:12px;padding:24px;margin-bottom:32px}
input,textarea{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:8px;padding:10px 14px;color:#e5e5e5;font-size:.95rem;margin-bottom:12px;outline:none;font-family:inherit}
input:focus,textarea:focus{border-color:#444}
textarea{min-height:80px;resize:vertical}
.btn-submit{background:#fff;color:#000;border:none;padding:10px 24px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.95rem}
.btn-submit:hover{opacity:.9}
.btn-submit:disabled{opacity:.4;cursor:not-allowed}
.message-card{background:#141414;border:1px solid #222;border-radius:12px;padding:20px;margin-bottom:16px}
.message-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.name{color:#fff;font-weight:600;font-size:1rem}
.time{color:#555;font-size:.8rem}
.content{color:#aaa;line-height:1.6;margin-bottom:12px;white-space:pre-wrap}
.replies{border-top:1px solid #222;margin-top:12px;padding-top:12px}
.reply{margin-bottom:10px;padding-left:12px;border-left:2px solid #333}
.reply-name{color:#ccc;font-weight:600;font-size:.9rem;margin-bottom:2px}
.reply-content{color:#777;font-size:.9rem}
.reply-form{display:none;margin-top:12px}
.reply-form.active{display:block}
.btn-reply{background:transparent;color:#888;border:1px solid #333;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.85rem}
.btn-reply:hover{color:#fff;border-color:#666}
.footer{margin-top:80px;text-align:center;color:#444;font-size:.85rem}
.footer a{color:#666;text-decoration:none;margin:0 8px}
.empty{color:#555;text-align:center;padding:40px 0;font-style:italic}
</style>
</head>
<body>
<div class="container">
<nav>
  <a href="/">Home</a>
  <a href="/about.html">About</a>
  <a href="/terms.html">Terms</a>
  <a href="/feedback.html" class="active">Feedback</a>
</nav>
<h1>Feedback</h1>
<p class="subtitle">Public board. Share ideas, report bugs, or just say hi. No login required.</p>

<div class="form-card">
  <input type="text" id="mName" placeholder="Your name" maxlength="50">
  <input type="email" id="mEmail" placeholder="Email (optional)" maxlength="100">
  <textarea id="mContent" placeholder="What's on your mind?" maxlength="2000"></textarea>
  <button class="btn-submit" id="submitBtn" onclick="postMessage()">Post Message</button>
</div>

<div id="messagesList"><div class="empty">Loading...</div></div>

<div class="footer">
  <a href="/">Home</a> · <a href="/about.html">About</a> · <a href="/terms.html">Terms</a>
</div>
</div>

<script>
async function loadMessages(){
  try{
    const res=await fetch('/api/messages');
    const msgs=await res.json();
    const box=document.getElementById('messagesList');
    if(!msgs.length){box.innerHTML='<div class="empty">No messages yet. Be the first!</div>';return;}
    box.innerHTML=msgs.map(m=>`
      <div class="message-card">
        <div class="message-header"><span class="name">${esc(m.name)}</span><span class="time">${fmtDate(m.createdAt)}</span></div>
        <div class="content">${esc(m.content)}</div>
        ${m.replies&&m.replies.length?`<div class="replies">${m.replies.map(r=>`<div class="reply"><div class="reply-name">${esc(r.name)} · ${fmtDate(r.createdAt)}</div><div class="reply-content">${esc(r.content)}</div></div>`).join('')}</div>`:''}
        <button class="btn-reply" onclick="toggleReply('${m.id}')">Reply</button>
        <div class="reply-form" id="reply-${m.id}">
          <input type="text" id="rName-${m.id}" placeholder="Your name" maxlength="50" style="margin-top:8px">
          <textarea id="rContent-${m.id}" placeholder="Write a reply..." maxlength="2000" style="min-height:60px"></textarea>
          <button class="btn-submit" onclick="postReply('${m.id}')">Send Reply</button>
        </div>
      </div>
    `).join('');
  }catch(e){document.getElementById('messagesList').innerHTML='<div class="empty">Failed to load messages.</div>';}
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleString();}
async function postMessage(){
  const name=document.getElementById('mName').value.trim();
  const email=document.getElementById('mEmail').value.trim();
  const content=document.getElementById('mContent').value.trim();
  if(!name||!content){alert('Name and message are required');return;}
  const btn=document.getElementById('submitBtn');btn.disabled=true;
  try{
    await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,content})});
    document.getElementById('mName').value='';document.getElementById('mEmail').value='';document.getElementById('mContent').value='';
    loadMessages();
  }catch(e){alert('Failed to post');}
  btn.disabled=false;
}
function toggleReply(id){document.getElementById('reply-'+id).classList.toggle('active');}
async function postReply(id){
  const name=document.getElementById('rName-'+id).value.trim();
  const content=document.getElementById('rContent-'+id).value.trim();
  if(!name||!content){alert('Name and reply are required');return;}
  try{
    await fetch(`/api/messages/${id}/reply`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,content})});
    loadMessages();
  }catch(e){alert('Failed to reply');}
}
loadMessages();
</script>
</body>
</html>
